# =============================================================================
#  Casos de evaluacion
# -----------------------------------------------------------------------------
#  Cada caso se ejecuta con cada persona indicada (casos x personas x
#  repeticiones). La persona simulada persigue el `objetivo`; al terminar la
#  conversacion, el evaluador juzga el `resultado_esperado` y los `criterios`,
#  y ademas se aplican las comprobaciones deterministas de `herramientas` y de
#  `resultado_esperado.debe_contener`.
#
#  Nota = suma de pesos cumplidos / suma de pesos. El caso se aprueba si la
#  nota >= umbral y se cumplen todos los elementos marcados como obligatorios.
#
#  resultado_esperado.tipo:
#    valor             una cifra concreta (valor + unidad + tolerancia)
#    no_existe         el dato no existe para lo pedido: no debe inventarlo
#    error_controlado  la peticion es invalida y el agente debe explicarlo
#    texto             una respuesta textual concreta (valor como texto)
#    libre             solo la descripcion; el evaluador decide
# =============================================================================
version: 1

suite:
  nombre: Indicadores de pobreza
  descripcion: Consultas de pobreza monetaria por ambito geografico y periodo.

defaults:
  max_turnos: 6               # turnos de la persona como maximo
  personas: [analista_experta, ciudadano_novato]   # vacio => todas
  umbral_aprobacion: 0.7      # nota minima para aprobar (0-1)

casos:
  - id: pobreza_lima_2025
    titulo: Pobreza monetaria 2025 en Lima Metropolitana
    objetivo: >
      Conseguir el porcentaje de pobreza monetaria de Lima Metropolitana para
      el año 2025, con la fuente del dato.
    # Opcional: primer mensaje literal. Si se omite, lo redacta el simulador
    # segun la persona.
    # mensaje_inicial: Hola, necesito el dato de pobreza de Lima para 2025.
    contexto_persona: >
      Te interesa Lima Metropolitana (no el departamento de Lima ni Lima
      Provincias). Quieres la pobreza monetaria total, no la extrema.
    resultado_esperado:
      tipo: valor
      descripcion: >
        El agente informa la pobreza monetaria de Lima Metropolitana en 2025
        con el valor oficial, indicando la unidad.
      valor: 24.9             # VALOR DE EJEMPLO: sustituyelo por el oficial
      unidad: "%"
      tolerancia: 0.1
      peso: 3
      obligatorio: true
    criterios:
      - id: ambito_correcto
        descripcion: Distingue Lima Metropolitana del departamento de Lima o de Lima Provincias.
        peso: 2
      - id: cita_fuente
        descripcion: Indica la fuente o el indicador consultado.
        peso: 1
      - id: sin_invenciones
        descripcion: Toda cifra que da esta respaldada por el resultado de una herramienta.
        peso: 2
        obligatorio: true
    herramientas:
      debe_usar: []           # p.ej. [step4_get_data]
      no_debe_usar: []
      max_llamadas: 12
      sin_errores: false
    etiquetas: [pobreza, lima, valor]

  - id: pobreza_lima_1990
    titulo: Periodo sin datos
    objetivo: >
      Conseguir el porcentaje de pobreza monetaria de Lima Metropolitana en
      1990.
    contexto_persona: Necesitas justo el año 1990 para comparar con la actualidad.
    resultado_esperado:
      tipo: no_existe
      descripcion: >
        El agente indica que el indicador no esta disponible para 1990 (o que
        la serie empieza despues) y no inventa ninguna cifra para ese año.
      no_debe_contener: []
    criterios:
      - id: explica_cobertura
        descripcion: Explica desde que año hay datos o que periodos cubre la serie.
        peso: 1
      - id: ofrece_alternativa
        descripcion: Ofrece una alternativa util (el primer año disponible, otra fuente...).
        peso: 1
    etiquetas: [pobreza, lima, no_existe]
